  function renderNghiemThuScoreTableHtml(idPrefix, tieuChi, diemValues, readonly, totalOverride, disabled) {
    let html = '<div class="table-wrapper"><table class="pheduyet-score-table"><thead><tr><th style="width:34px;">STT</th><th>Tiêu chí nhận xét</th><th>Điểm đạt được</th></tr></thead><tbody>';
    let sumForDisplay = 0;
    tieuChi.forEach(function (tc, i) {
      const val = diemValues && diemValues[tc.key] !== undefined ? diemValues[tc.key] : "";
      sumForDisplay += parseFloat(val) || 0;
      if (readonly) {
        html += '<tr><td class="pheduyet-stt">' + (i + 1) + '</td><td>' + escapeHtml(tc.label) + '</td><td>' + escapeHtml(String(val || 0)) + ' / ' + tc.max + '</td></tr>';
      } else {
        html += '<tr><td class="pheduyet-stt">' + (i + 1) + '</td><td>' + escapeHtml(tc.label) + '</td>' +
          '<td class="pheduyet-diem-cell">' +
            '<input type="number" autocomplete="off" min="0" max="' + tc.max + '" step="0.1" id="' + idPrefix + '_diem_' + tc.key + '" value="' + escapeAttr(val) + '"' + (disabled ? " disabled" : "") + ' oninput="recomputeNghiemThuTotal(\'' + idPrefix + '\')">' +
            '<div class="pheduyet-diem-hint">Tối đa ' + tc.max + ' điểm</div>' +
          '</td></tr>';
      }
    });
    const maxTotal = tieuChi.reduce(function (s, tc) { return s + tc.max; }, 0);
    const totalDisplay = readonly
      ? (totalOverride !== undefined && totalOverride !== "" && totalOverride !== null ? totalOverride : sumForDisplay)
      : 0;
    html += '<tr class="pheduyet-total-row"><td colspan="2">Tổng điểm</td><td><span class="pheduyet-total-value" id="' + idPrefix + '_total">' +
      escapeHtml(String(totalDisplay)) + '</span> / ' + maxTotal + '</td></tr>';
    html += '</tbody></table></div>';
    return html;
  }

  function recomputeNghiemThuTotal(idPrefix) {
    if (!ntCurrentData) return;
    let s = 0;
    ntCurrentData.tieuChi.forEach(function (tc) {
      const el = document.getElementById(idPrefix + "_diem_" + tc.key);
      if (el) s += parseFloat(el.value) || 0;
    });
    const totalEl = document.getElementById(idPrefix + "_total");
    if (totalEl) totalEl.innerText = Math.round(s * 10) / 10;
  }

  function renderNghiemThuFormBox() {
    const data = ntCurrentData;
    const box = document.getElementById("nghiemthuFormBox");

    if (data.isAdmin) {
      box.innerHTML = '<div class="empty">Tài khoản Admin chỉ xem, không chấm điểm. Xem chi tiết từng phiếu ở danh sách bên dưới.</div>';
      return;
    }

    if (!data.isAssigned) {
      box.innerHTML = '<div class="empty">Bạn không được phân công nghiệm thu đề án/sáng kiến này.</div>';
      return;
    }

    if (data.ownPhieu && !ntOwnEditing) {
      let html = '<div class="file-note">Bạn đã nộp phiếu nghiệm thu cho đề án/sáng kiến này.</div>';
      html += renderNghiemThuScoreTableHtml("ntOwnView", data.tieuChi, data.ownPhieu.diem, true, data.ownPhieu.tongdiem, false);
      html += '<div class="form-group"><label><input type="checkbox" disabled' + (data.ownPhieu.dexuat ? " checked" : "") + ' style="width:auto;margin-right:8px;">' + escapeHtml(data.dexuatLabel) + '</label></div>';
      html += '<div class="form-group"><label>Ý kiến nhận xét</label><div>' + (data.ownPhieu.ykien ? nl2br(data.ownPhieu.ykien) : '<span style="color:#999;">(không có)</span>') + '</div></div>';
      html += '<div class="form-group"><label>Kết luận</label><div><b>' + escapeHtml(data.ownPhieu.ketluan) + '</b></div></div>';
      if (data.canSubmit) {
        html += '<button type="button" class="secondary-btn" style="width:auto;padding:10px 20px;" onclick="enterNghiemThuEditMode()">Chỉnh sửa</button>';
      } else if (data.blockedMessage) {
        html += '<div class="file-note" style="color:var(--color-danger);">' + escapeHtml(data.blockedMessage) + '</div>';
      }
      box.innerHTML = html;
      return;
    }

    if (!data.canSubmit && !data.ownPhieu) {
      box.innerHTML = '<div class="empty">' + escapeHtml(data.blockedMessage || "Đợt nghiệm thu hiện chưa mở.") + '</div>';
      return;
    }

    const disabled = !data.hasFile;
    const diemValues = data.ownPhieu ? data.ownPhieu.diem : {};
    let html = '';
    if (disabled) {
      html += '<div class="file-note" style="color:var(--color-danger);">Chưa có báo cáo nghiệm thu để chấm - bảng kiểm bên dưới tạm khóa cho tới khi có file.</div>';
    }
    html += '<div style="' + (disabled ? "opacity:0.5;" : "") + '">';
    html += renderNghiemThuScoreTableHtml("ntForm", data.tieuChi, diemValues, false, undefined, disabled);
    html += '<div class="form-group"><label><input type="checkbox" id="ntFormDexuat"' + (disabled ? " disabled" : "") + (data.ownPhieu && data.ownPhieu.dexuat ? " checked" : "") + ' style="width:auto;margin-right:8px;">' + escapeHtml(data.dexuatLabel) + '</label></div>';
    html += '<div class="form-group"><label>Ý kiến nhận xét</label><textarea id="ntFormYKien"' + (disabled ? " disabled" : "") + '>' + escapeHtml(data.ownPhieu ? data.ownPhieu.ykien : "") + '</textarea></div>';

    html += '<div class="form-group"><label>Kết luận</label>';
    data.ketLuanOptions.forEach(function (opt) {
      const checked = data.ownPhieu && data.ownPhieu.ketluan === opt ? "checked" : "";
      html += '<label class="dangky-radio-option' + (disabled ? " disabled" : "") + '"><input type="radio" name="ntFormKetLuan" value="' + escapeAttr(opt) + '" ' + checked + (disabled ? " disabled" : "") + '><span class="opt-label">' + escapeHtml(opt) + '</span></label>';
    });
    html += '</div>';

    html += '<div style="display:flex;gap:10px;">';
    if (data.ownPhieu) html += '<button type="button" class="secondary-btn" style="width:auto;padding:10px 20px;" onclick="cancelNghiemThuEdit()">Hủy</button>';
    html += '<button type="button" class="primary" style="width:auto;padding:10px 20px;" id="ntFormSaveBtn"' + (disabled ? " disabled" : "") + ' onclick="saveNghiemThuForm()">Lưu</button>';
    html += '</div>';
    html += '<div id="nghiemthuFormMessage" class="msg"></div>';
    html += '</div>';

    box.innerHTML = html;
    if (!disabled) recomputeNghiemThuTotal("ntForm");
  }

  function enterNghiemThuEditMode() { ntOwnEditing = true; renderNghiemThuFormBox(); }
  function cancelNghiemThuEdit() { ntOwnEditing = false; renderNghiemThuFormBox(); }

  function saveNghiemThuForm() {
    const data = ntCurrentData;
    const diem = {};
    data.tieuChi.forEach(function (tc) {
      const el = document.getElementById("ntForm_diem_" + tc.key);
      diem[tc.key] = el ? el.value : "";
    });
    const dexuat = document.getElementById("ntFormDexuat").checked;
    const ykien = document.getElementById("ntFormYKien").value.trim();
    const ketLuanEl = document.querySelector('input[name="ntFormKetLuan"]:checked');
    const ketLuan = ketLuanEl ? ketLuanEl.value : "";

    const msgBox = document.getElementById("nghiemthuFormMessage");
    msgBox.innerHTML = "";

    if (!ketLuan) { msgBox.innerHTML = '<span class="error">Vui lòng chọn Kết luận.</span>'; return; }

    const btn = document.getElementById("ntFormSaveBtn");
    btn.disabled = true; btn.innerText = "Đang lưu...";

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false; btn.innerText = "Lưu";
        if (!result.success) { msgBox.innerHTML = '<span class="error">' + escapeHtml(result.message) + '</span>'; return; }
        ntOwnEditing = false;
        loadNghiemThuData();
      })
      .withFailureHandler(function (error) {
        btn.disabled = false; btn.innerText = "Lưu";
        if (isSessionExpiredError(error)) { showSessionExpiredModal(); return; }
        msgBox.innerHTML = '<span class="error">Có lỗi xảy ra: ' + escapeHtml(error.message) + '</span>';
      })
      .saveNghiemThuPhieu(token(), {
        maDeAn: ntSelectedMaDeAn, khoaPhong: ntSelectedKhoa, tenDeAn: ntSelectedTenDeAn, dangkyId: ntSelectedDangkyId,
        diem: diem, dexuatThanhPho: dexuat, ykienNhanXet: ykien, ketLuan: ketLuan
      });
  }

  function renderNghiemThuPhieuList() {
    const data = ntCurrentData;
    const listBox = document.getElementById("nghiemthuPhieuList");
    const detailBox = document.getElementById("nghiemthuPhieuDetail");
    const panel = document.getElementById("nghiemthuDetailPanel");
    detailBox.innerHTML = "";
    panel.classList.remove("open");

    if (!data.phieuList || data.phieuList.length === 0) {
      listBox.innerHTML = '<div class="empty">Chưa có phiếu nghiệm thu nào.</div>';
      return;
    }

    let html = "";
    data.phieuList.forEach(function (p, i) {
      const active = ntExpandedPhieuIndex === i ? " active" : "";
      html += '<button type="button" class="dangky-history-btn' + active + '" onclick="toggleNghiemThuPhieuDetail(' + i + ')">Phiếu nghiệm thu ' + (i + 1) + ' - ' + escapeHtml(ntSelectedKhoa) + '</button>';
    });
    listBox.innerHTML = html;

    if (ntExpandedPhieuIndex !== null) renderNghiemThuPhieuDetail();
  }

  function toggleNghiemThuPhieuDetail(index) {
    ntExpandedPhieuIndex = (ntExpandedPhieuIndex === index) ? null : index;
    renderNghiemThuPhieuList();
  }

  function renderNghiemThuPhieuDetail() {
    const data = ntCurrentData;
    const detailBox = document.getElementById("nghiemthuPhieuDetail");
    const panel = document.getElementById("nghiemthuDetailPanel");
    const p = data.phieuList[ntExpandedPhieuIndex];
    if (!p) { detailBox.innerHTML = ""; panel.classList.remove("open"); return; }
    panel.classList.add("open");

    let html = '<div class="dangky-detail-box"><h3 style="margin-top:0;color:var(--color-primary);">Người nhận xét: ' + escapeHtml(p.hoTen || "---") + '</h3>';
    html += renderNghiemThuScoreTableHtml("ntPhieuView" + ntExpandedPhieuIndex, data.tieuChi, p.diem, true, p.tongdiem, false);
    html += '<div class="form-group"><label><input type="checkbox" disabled' + (p.dexuat ? " checked" : "") + ' style="width:auto;margin-right:8px;">' + escapeHtml(data.dexuatLabel) + '</label></div>';
    html += '<div class="form-group"><label>Ý kiến nhận xét</label><div>' + (p.ykien ? nl2br(p.ykien) : '<span style="color:#999;">(không có)</span>') + '</div></div>';
    html += '<div class="form-group"><label>Kết luận</label><div><b>' + escapeHtml(p.ketluan) + '</b></div></div>';
    html += '<div class="file-note">Thời gian nộp: ' + escapeHtml(p.thoigian) + '</div>';
    html += '</div>';
    detailBox.innerHTML = html;
  }

  // ==========================================================
  // TRANG PHE DUYET
  // - Admin: chi xem (khong co form nhap), 2 cong tac bat/tat rieng cho lan 1 / lan 2.
  // - TVHĐ: nhap/sua phieu CUA CHINH MINH.
  // - "Chua phe duyet": dang danh sach (accordion), KHONG con dropdown chon khoa/ten cho TVHĐ.
  //   Admin GIU dropdown loc (chi de LOC BOT danh sach, mac dinh hien TAT CA).
  // ==========================================================
  const PHEDUYET_MAX_DIEM_CLIENT = 10;

  let pheduyetLan = 1;
  let pheduyetSubTab = "chua";
  let pheduyetDeAnListCache = null;
  let pheduyetCurrentData = null;
  let pheduyetSelectedKhoa = "";
  let pheduyetSelectedMaDeAn = "";
  let pheduyetSelectedTenDeAn = "";
  let pheduyetSelectedDangkyId = "";
  let pheduyetOwnEditing = false;
  let pheduyetHistoryData = [];
  let pheduyetHistoryExpandedIndex = null;
  let pheduyetHistorySelectedPhieuIndex = null;
  let pheduyetHistoryEditingOwn = false; // dang o che do Sua ngay tai cho trong tab "Da phe duyet"

  // Danh sach "Chua phe duyet" dang duoc hien thi (sau khi loc bo da nop/da du 2 phieu +
  // loc theo dropdown Khoa/phong cua Admin neu co chon) va vi tri dang mo (accordion)
  let pheduyetChuaFilteredList = [];
  let pheduyetChuaExpandedIndex = null;

  function initPheDuyetScreen() {
    pheduyetLan = 1;
    pheduyetSubTab = "chua";
    document.querySelectorAll("#pheduyetTabs .report-tab-btn").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-lan") === "1");
    });
    document.querySelectorAll("#pheduyetSubTabs .report-tab-btn").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-subtab") === "chua");
    });
    document.getElementById("pheduyetSubTabChua").style.display = "block";
    document.getElementById("pheduyetSubTabDa").style.display = "none";
    document.getElementById("pdKhoaPhongFilter").innerHTML = '<option value="">Tất cả khoa/phòng</option>';
    document.getElementById("pheduyetEmptyNote").style.display = "none";
    pheduyetSelectedKhoa = ""; pheduyetSelectedMaDeAn = ""; pheduyetSelectedTenDeAn = ""; pheduyetSelectedDangkyId = "";
    pheduyetCurrentData = null;
    pheduyetDeAnListCache = null;
    pheduyetChuaFilteredList = [];
    pheduyetChuaExpandedIndex = null;
    pheduyetHistoryEditingOwn = false;
    document.getElementById("pheduyetChuaList").innerHTML = "";
    document.getElementById("pheduyetChuaDetail").innerHTML = "";
    document.getElementById("pheduyetChuaDetailPanel").classList.remove("open");

    const isAdminAcc = session && String(session.vaiTro).trim() === "Admin";
    document.getElementById("pheduyetAdminToggle").style.display = isAdminAcc ? "block" : "none";
    document.getElementById("pheduyetChuaFilterBox").style.display = isAdminAcc ? "block" : "none";
    if (isAdminAcc) loadPheDuyetStatus();

    initDeadlineBanner("pheduyetDeadlineBanner");
    loadPheDuyetTemplateLinks();
    loadPheDuyetDeAnList();
    loadPheDuyetHistoryForRound();
  }

  function selectPheDuyetSubTab(tab) {
    pheduyetSubTab = tab;
    document.querySelectorAll("#pheduyetSubTabs .report-tab-btn").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-subtab") === tab);
    });
    document.getElementById("pheduyetSubTabChua").style.display = tab === "chua" ? "block" : "none";
    document.getElementById("pheduyetSubTabDa").style.display = tab === "da" ? "block" : "none";
  }

  function selectPheDuyetLan(lan) {
    pheduyetLan = lan;
    document.querySelectorAll("#pheduyetTabs .report-tab-btn").forEach(function (b) {
      b.classList.toggle("active", parseInt(b.getAttribute("data-lan"), 10) === lan);
    });
    pheduyetChuaExpandedIndex = null;
    pheduyetHistoryEditingOwn = false;
    loadPheDuyetHistoryForRound();
  }

  function loadPheDuyetStatus() {
    google.script.run
      .withSuccessHandler(function (status) {
        document.getElementById("pheduyetToggleLan1").checked = !!status.lan1;
        document.getElementById("pheduyetToggleLan2").checked = !!status.lan2;
      })
      .withFailureHandler(function (error) { handleServerError(error, "Không tải được trạng thái"); })
      .getPheDuyetStatus(token());
  }

  function togglePheDuyetStatus(lan, checked) {
    google.script.run
      .withSuccessHandler(function (result) {
        if (!result.success) { alert(result.message); loadPheDuyetStatus(); return; }
      })
      .withFailureHandler(function (error) { handleServerError(error, "Không thể cập nhật"); loadPheDuyetStatus(); })
      .setPheDuyetStatus(token(), lan, checked);
  }

  function loadPheDuyetDeAnList() {
    if (pheduyetDeAnListCache) { renderPheDuyetKhoaFilterOptions_(); renderPheDuyetChuaList(); return; }
    google.script.run
      .withSuccessHandler(function (list) {
        pheduyetDeAnListCache = list || [];
        renderPheDuyetKhoaFilterOptions_();
        renderPheDuyetChuaList();
      })
      .withFailureHandler(function (error) { handleServerError(error, "Không tải được danh sách đề án được phân công"); })
      .getPheDuyetDeAnList(token());
  }

  // Rieng cho Admin: xay dropdown loc theo tung Khoa/phong DUY NHAT tu pheduyetDeAnListCache
  function renderPheDuyetKhoaFilterOptions_() {
    const admin = session && String(session.vaiTro).trim() === "Admin";
    if (!admin) return;
    const select = document.getElementById("pdKhoaPhongFilter");
    const currentValue = select.value;
    const set = {};
    (pheduyetDeAnListCache || []).forEach(function (item) { set[item.khoaphong] = true; });
    const khoaList = Object.keys(set).sort(function (a, b) { return a.localeCompare(b, "vi", { sensitivity: "base" }); });
    select.innerHTML = '<option value="">Tất cả khoa/phòng</option>' +
      khoaList.map(function (k) { return '<option value="' + escapeAttr(k) + '"' + (k === currentValue ? " selected" : "") + '>' + escapeHtml(k) + '</option>'; }).join("");
  }

  // Tinh danh sach "Chua phe duyet": TVHĐ = de an ho CHUA nop o lan dang chon; Admin = de an
  // CHUA DU 2 phieu o lan dang chon (dung dung logic voi so dem tab). Sau do loc them theo
  // dropdown Khoa/phong neu la Admin va co chon.
  function computePheDuyetChuaList_() {
    const admin = session && String(session.vaiTro).trim() === "Admin";
    const excludedDangkyIds = {};

    if (admin) {
      (pheduyetHistoryData || []).forEach(function (g) {
        if (g.phieus.length >= 2) excludedDangkyIds[g.dangkyId] = true;
      });
    } else {
      (pheduyetHistoryData || []).forEach(function (g) {
        if (g.phieus.some(function (p) { return p.isOwn; })) excludedDangkyIds[g.dangkyId] = true;
      });
    }

    let list = (pheduyetDeAnListCache || []).filter(function (item) {
      return !(item.dangkyId && excludedDangkyIds[item.dangkyId]);
    });

    if (admin) {
      const filterVal = document.getElementById("pdKhoaPhongFilter").value;
      if (filterVal) list = list.filter(function (item) { return item.khoaphong === filterVal; });
    }

    list.sort(function (a, b) {
      const c = a.khoaphong.localeCompare(b.khoaphong, "vi", { sensitivity: "base" });
      if (c !== 0) return c;
      return a.tendean.localeCompare(b.tendean, "vi", { sensitivity: "base" });
    });

    return list;
  }

  function renderPheDuyetChuaList() {
    pheduyetChuaFilteredList = computePheDuyetChuaList_();
    const listBox = document.getElementById("pheduyetChuaList");
    document.getElementById("pheduyetEmptyNote").style.display = pheduyetChuaFilteredList.length === 0 ? "block" : "none";

    if (pheduyetChuaFilteredList.length === 0) {
      listBox.innerHTML = "";
      document.getElementById("pheduyetChuaDetail").innerHTML = "";
      document.getElementById("pheduyetChuaDetailPanel").classList.remove("open");
      pheduyetChuaExpandedIndex = null;
      updatePheDuyetTabCounts();
      return;
    }

    // Neu de an dang mo khong con nam trong danh sach loc moi (vd Admin vua doi dropdown loc) -> dong lai
    if (pheduyetChuaExpandedIndex !== null && pheduyetChuaExpandedIndex >= pheduyetChuaFilteredList.length) {
      pheduyetChuaExpandedIndex = null;
    }

    let html = "";
    pheduyetChuaFilteredList.forEach(function (item, i) {
      const active = pheduyetChuaExpandedIndex === i ? " active" : "";
      const label = item.tendean + " - " + item.khoaphong;
      html += '<button type="button" class="dangky-history-btn' + active + '" onclick="togglePheDuyetChuaItem(' + i + ')">' + escapeHtml(label) + '</button>';
    });
    listBox.innerHTML = html;

    if (pheduyetChuaExpandedIndex !== null) {
      renderPheDuyetChuaDetail();
    } else {
      document.getElementById("pheduyetChuaDetail").innerHTML = "";
      document.getElementById("pheduyetChuaDetailPanel").classList.remove("open");
    }

    updatePheDuyetTabCounts();
  }

  function togglePheDuyetChuaItem(index) {
    pheduyetChuaExpandedIndex = (pheduyetChuaExpandedIndex === index) ? null : index;
    renderPheDuyetChuaList();
  }

  // Bam vao 1 de an trong danh sach "Chua phe duyet" -> mo accordion chia doi File/Bang kiem
  // ngay ben duoi (giong het kieu "Da phe duyet"), dung lai cac ham loadPheDuyetData/
  // renderPheDuyetFormBox... hien co, chi doi noi render tu #pheduyetSplitView (cu, da bo) sang
  // 1 khoi HTML duoc tao moi moi lan mo, nam trong chinh accordion nay.
  function renderPheDuyetChuaDetail() {
    const item = pheduyetChuaFilteredList[pheduyetChuaExpandedIndex];
    const detailBox = document.getElementById("pheduyetChuaDetail");
    const panel = document.getElementById("pheduyetChuaDetailPanel");
    if (!item) { detailBox.innerHTML = ""; panel.classList.remove("open"); return; }
    panel.classList.add("open");

    pheduyetSelectedKhoa = item.khoaphong;
    pheduyetSelectedMaDeAn = item.madean;
    pheduyetSelectedTenDeAn = item.tendean;
    pheduyetSelectedDangkyId = item.dangkyId;
    pheduyetOwnEditing = false;

    detailBox.innerHTML =
      '<div class="pheduyet-split">' +
        '<div class="card pheduyet-pane">' +
          '<h3 style="margin-top:0;color:#1c47c6;">File đề án/sáng kiến</h3>' +
          '<div id="pheduyetFileBox"></div>' +
        '</div>' +
        '<div class="card pheduyet-pane">' +
          '<h3 style="margin-top:0;color:#1c47c6;" id="pheduyetFormTitle">Phiếu phê duyệt</h3>' +
          '<div id="pheduyetFormBox"></div>' +
        '</div>' +
      '</div>';

    loadPheDuyetData();
  }

  function loadPheDuyetData() {
    document.getElementById("pheduyetFileBox").innerHTML = '<div class="empty">Đang tải...</div>';
    document.getElementById("pheduyetFormBox").innerHTML = '<div class="empty">Đang tải...</div>';
    pheduyetOwnEditing = false;

    google.script.run
      .withSuccessHandler(function (data) {
        pheduyetCurrentData = data;
        renderPheDuyetSplitView();
      })
      .withFailureHandler(function (error) {
        if (isSessionExpiredError(error)) { showSessionExpiredModal(); return; }
        document.getElementById("pheduyetFormBox").innerHTML = '<div class="error">' + escapeHtml(error.message) + '</div>';
        document.getElementById("pheduyetFileBox").innerHTML = "";
      })
      .getPheDuyetData(token(), pheduyetLan, pheduyetSelectedKhoa, pheduyetSelectedTenDeAn, pheduyetSelectedMaDeAn, pheduyetSelectedDangkyId);
  }

  function renderPheDuyetSplitView() {
    const data = pheduyetCurrentData;
    if (!data) return;

    document.getElementById("pheduyetFormTitle").innerText = data.formTitle;
    document.getElementById("pheduyetFileBox").innerHTML = renderPheDuyetFileBoxHtml_(data.fileUrl);
    renderPheDuyetFormBox();
  }

  function extractDriveFileId_(url) {
    const s = String(url || "");
    let m = s.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (m) return m[1];
    m = s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m) return m[1];
    return null;
  }

  function renderPheDuyetFileBoxHtml_(fileUrl) {
    if (!fileUrl) {
      return '<div class="empty" style="padding:10px 0;">Chưa có file đính kèm cho đề án/sáng kiến này ở lần phê duyệt này.</div>';
    }
    if (!/^https?:\/\//i.test(String(fileUrl).trim())) {
      return '<div class="file-note" style="font-style:normal;padding:10px 0;">' + escapeHtml(fileUrl) + '</div>';
    }
    let html = '<a class="file-link" href="' + escapeAttr(fileUrl) + '" target="_blank" rel="noopener">Xem file đề án/sáng kiến</a>';
    const fileId = extractDriveFileId_(fileUrl);
    if (fileId) {
      const previewUrl = "https://drive.google.com/file/d/" + fileId + "/preview";
      html += '<div class="pheduyet-file-embed"><iframe src="' + escapeAttr(previewUrl) + '" allow="autoplay"></iframe></div>';
    }
    return html;
  }

  function sumArray_(arr) {
    if (!Array.isArray(arr)) return 0;
    let s = 0;
    arr.forEach(function (v) { s += parseFloat(v) || 0; });
    return Math.round(s * 10) / 10;
  }

  function renderPheDuyetScoreTableHtml(idPrefix, tieuChi, diemValues, readonly, totalOverride) {
    let html = '<div class="table-wrapper"><table class="pheduyet-score-table"><thead><tr><th style="width:34px;">STT</th><th>Tiêu chí nhận xét</th><th>Điểm đạt được</th></tr></thead><tbody>';
    tieuChi.forEach(function (text, i) {
      const val = diemValues && diemValues[i] !== undefined ? diemValues[i] : "";
      if (readonly) {
        html += '<tr><td class="pheduyet-stt">' + (i + 1) + '</td><td>' + escapeHtml(text) + '</td><td>' + escapeHtml(String(val)) + ' / ' + PHEDUYET_MAX_DIEM_CLIENT + '</td></tr>';
      } else {
        html += '<tr><td class="pheduyet-stt">' + (i + 1) + '</td><td>' + escapeHtml(text) + '</td>' +
          '<td class="pheduyet-diem-cell">' +
            '<input type="number" autocomplete="off" min="0" max="' + PHEDUYET_MAX_DIEM_CLIENT + '" step="0.1" id="' + idPrefix + '_diem_' + i + '" value="' + escapeAttr(val) + '" oninput="recomputePheDuyetTotal(\'' + idPrefix + '\')">' +
            '<div class="pheduyet-diem-hint">Tối đa ' + PHEDUYET_MAX_DIEM_CLIENT + ' điểm</div>' +
          '</td></tr>';
      }
    });
    const totalDisplay = readonly
      ? (totalOverride !== undefined && totalOverride !== "" && totalOverride !== null ? totalOverride : sumArray_(diemValues))
      : 0;
    html += '<tr class="pheduyet-total-row"><td colspan="2">Tổng điểm</td><td><span class="pheduyet-total-value" id="' + idPrefix + '_total">' +
      escapeHtml(String(totalDisplay)) + '</span> / ' + (tieuChi.length * PHEDUYET_MAX_DIEM_CLIENT) + '</td></tr>';
    html += '</tbody></table></div>';
    return html;
  }

  function recomputePheDuyetTotal(idPrefix) {
    let s = 0;
    for (let i = 0; i < 10; i++) {
      const el = document.getElementById(idPrefix + "_diem_" + i);
      if (el) s += parseFloat(el.value) || 0;
    }
    const totalEl = document.getElementById(idPrefix + "_total");
    if (totalEl) totalEl.innerText = Math.round(s * 10) / 10;
  }

  function renderPheDuyetFormBox() {
    const data = pheduyetCurrentData;
    const box = document.getElementById("pheduyetFormBox");

    if (data.isAdmin) {
      box.innerHTML = '<div class="empty">Tài khoản Admin chỉ xem, không chấm điểm. Xem chi tiết từng phiếu ở danh sách bên dưới.</div>';
      return;
    }

    if (!data.isAssigned) {
      box.innerHTML = '<div class="empty">Bạn không được phân công chấm đề án/sáng kiến này.</div>';
      return;
    }

    if (data.ownPhieu && !pheduyetOwnEditing) {
      let html = '<div class="file-note">Bạn đã nộp phiếu phê duyệt cho đề án/sáng kiến này.</div>';
      html += renderPheDuyetScoreTableHtml("pdOwnView", data.tieuChi, data.ownPhieu.diem, true, data.ownPhieu.tongdiem);
      html += '<div class="form-group"><label>Ý kiến nhận xét</label><div>' + (data.ownPhieu.ykien ? nl2br(data.ownPhieu.ykien) : '<span style="color:#999;">(không có)</span>') + '</div></div>';
      html += '<div class="form-group"><label>Kết luận</label><div><b>' + escapeHtml(data.ownPhieu.ketluan) + '</b></div></div>';
      if (data.canSubmit) {
        html += '<button type="button" class="secondary-btn" style="width:auto;padding:10px 20px;" onclick="enterPheDuyetEditMode()">Chỉnh sửa</button>';
      } else if (data.blockedMessage) {
        html += '<div class="file-note" style="color:var(--color-danger);">' + escapeHtml(data.blockedMessage) + '</div>';
      }
      box.innerHTML = html;
      return;
    }

    if (!data.canSubmit && !data.ownPhieu) {
      box.innerHTML = '<div class="empty">' + escapeHtml(data.blockedMessage || "Đề án/sáng kiến này hiện chưa mở đợt phê duyệt.") + '</div>';
      return;
    }

    const diemValues = data.ownPhieu ? data.ownPhieu.diem : [];
    let html = renderPheDuyetScoreTableHtml("pdForm", data.tieuChi, diemValues, false);

    html += '<div class="form-group"><label>Ý kiến nhận xét</label><textarea id="pdFormYKien">' + escapeHtml(data.ownPhieu ? data.ownPhieu.ykien : "") + '</textarea></div>';

    html += '<div class="form-group"><label>Kết luận</label>';
    data.ketLuanOptions.forEach(function (opt) {
      const checked = data.ownPhieu && data.ownPhieu.ketluan === opt ? "checked" : "";
      html += '<label class="dangky-radio-option"><input type="radio" name="pdFormKetLuan" value="' + escapeAttr(opt) + '" ' + checked + '><span class="opt-label">' + escapeHtml(opt) + '</span></label>';
    });
    html += '</div>';

    html += '<div style="display:flex;gap:10px;">';
    if (data.ownPhieu) html += '<button type="button" class="secondary-btn" style="width:auto;padding:10px 20px;" onclick="cancelPheDuyetEdit()">Hủy</button>';
    html += '<button type="button" class="primary" style="width:auto;padding:10px 20px;" id="pdFormSaveBtn" onclick="savePheDuyetForm()">Lưu</button>';
    html += '</div>';
    html += '<div id="pheduyetFormMessage" class="msg"></div>';

    box.innerHTML = html;

    for (let i = 0; i < 10; i++) {
      const el = document.getElementById("pdForm_diem_" + i);
      if (el) el.value = (diemValues && diemValues[i] !== undefined) ? diemValues[i] : "";
    }
    const ykienEl = document.getElementById("pdFormYKien");
    if (ykienEl) ykienEl.value = data.ownPhieu ? (data.ownPhieu.ykien || "") : "";

    recomputePheDuyetTotal("pdForm");
  }

  function enterPheDuyetEditMode() { pheduyetOwnEditing = true; renderPheDuyetFormBox(); }
  function cancelPheDuyetEdit() { pheduyetOwnEditing = false; renderPheDuyetFormBox(); }

  function savePheDuyetForm() {
    const diem = [];
    for (let i = 0; i < 10; i++) {
      const el = document.getElementById("pdForm_diem_" + i);
      diem.push(el ? el.value : "");
    }
    const ykien = document.getElementById("pdFormYKien").value.trim();
    const ketLuanEl = document.querySelector('input[name="pdFormKetLuan"]:checked');
    const ketLuan = ketLuanEl ? ketLuanEl.value : "";

    const msgBox = document.getElementById("pheduyetFormMessage");
    msgBox.innerHTML = "";

    if (!ketLuan) { msgBox.innerHTML = '<span class="error">Vui lòng chọn Kết luận.</span>'; return; }

    const btn = document.getElementById("pdFormSaveBtn");
    btn.disabled = true; btn.innerText = "Đang lưu...";

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false; btn.innerText = "Lưu";
        if (!result.success) { msgBox.innerHTML = '<span class="error">' + escapeHtml(result.message) + '</span>'; return; }
        // Sau khi nop thanh cong: de an nay se bien mat khoi "Chua phe duyet" (TVHĐ da nop) ->
        // tai lai Lich su (se tu dong lam moi lai ca danh sach "Chua" thong qua chuoi goi ben duoi).
        pheduyetOwnEditing = false;
        loadPheDuyetHistoryForRound();
      })
      .withFailureHandler(function (error) {
        btn.disabled = false; btn.innerText = "Lưu";
        if (isSessionExpiredError(error)) { showSessionExpiredModal(); return; }
        msgBox.innerHTML = '<span class="error">Có lỗi xảy ra: ' + escapeHtml(error.message) + '</span>';
      })
      .savePheDuyetPhieu(token(), pheduyetLan, {
        maDeAn: pheduyetSelectedMaDeAn, khoaPhong: pheduyetSelectedKhoa, tenDeAn: pheduyetSelectedTenDeAn,
        dangkyId: pheduyetSelectedDangkyId,
        diem: diem, ykienNhanXet: ykien, ketLuan: ketLuan
      });
  }

  // So dem "(xx/xx)" canh 2 tab con, tinh theo LAN dang chon.
  function updatePheDuyetTabCounts() {
    if (!pheduyetDeAnListCache) return;
    const admin = session && String(session.vaiTro).trim() === "Admin";
    const total = pheduyetDeAnListCache.length;
    let daCount;
    if (admin) {
      daCount = (pheduyetHistoryData || []).filter(function (g) { return g.phieus.length >= 2; }).length;
    } else {
      daCount = (pheduyetHistoryData || []).length;
    }
    const chuaCount = total - daCount;

    const btnChua = document.querySelector('#pheduyetSubTabs [data-subtab="chua"]');
    const btnDa = document.querySelector('#pheduyetSubTabs [data-subtab="da"]');
    if (btnChua) btnChua.innerText = "Chưa phê duyệt (" + chuaCount + "/" + total + ")";
    if (btnDa) btnDa.innerText = "Đã phê duyệt (" + daCount + "/" + total + ")";
  }

  // Danh sach "Lich su phe duyet" - toan bo phieu cua LAN dang chon.
  function loadPheDuyetHistoryForRound() {
    const listBox = document.getElementById("pheduyetPhieuList");
    listBox.innerHTML = '<div class="empty">Đang tải...</div>';
    pheduyetHistoryExpandedIndex = null;
    pheduyetHistorySelectedPhieuIndex = null;
    pheduyetHistoryEditingOwn = false;
    document.getElementById("pheduyetPhieuDetail").innerHTML = "";
    document.getElementById("pheduyetDetailPanel").classList.remove("open");

    google.script.run
      .withSuccessHandler(function (data) {
        pheduyetHistoryData = data || [];
        renderPheDuyetPhieuList();
        // Lam moi lai danh sach "Chua phe duyet" theo du lieu vua tai (loai bo de an vua nop)
        if (pheduyetDeAnListCache) renderPheDuyetChuaList();
        else updatePheDuyetTabCounts();
      })
      .withFailureHandler(function (error) {
        if (isSessionExpiredError(error)) { listBox.innerHTML = ""; showSessionExpiredModal(); return; }
        listBox.innerHTML = '<div class="error">' + escapeHtml(error.message) + '</div>';
      })
      .getPheDuyetRoundHistory(token(), pheduyetLan);
  }

  function renderPheDuyetPhieuList() {
    const listBox = document.getElementById("pheduyetPhieuList");

    if (!pheduyetHistoryData || pheduyetHistoryData.length === 0) {
      listBox.innerHTML = '<div class="empty">Chưa có phiếu phê duyệt nào.</div>';
      return;
    }

    let html = "";
    pheduyetHistoryData.forEach(function (g, i) {
      const active = pheduyetHistoryExpandedIndex === i ? " active" : "";
      const label = "Phiếu phê duyệt " + (i + 1) + " - " + g.khoaphong;
      html += '<button type="button" class="dangky-history-btn' + active + '" onclick="togglePheDuyetPhieuDetail(' + i + ')">' + escapeHtml(label) + '</button>';
    });
    listBox.innerHTML = html;

    if (pheduyetHistoryExpandedIndex !== null) renderPheDuyetPhieuDetail();
  }

  function togglePheDuyetPhieuDetail(index) {
    pheduyetHistoryExpandedIndex = (pheduyetHistoryExpandedIndex === index) ? null : index;
    pheduyetHistorySelectedPhieuIndex = null;
    pheduyetHistoryEditingOwn = false;
    renderPheDuyetPhieuList();
  }

  function renderPheDuyetPhieuDetail() {
    const detailBox = document.getElementById("pheduyetPhieuDetail");
    const panel = document.getElementById("pheduyetDetailPanel");
    const g = pheduyetHistoryData[pheduyetHistoryExpandedIndex];
    if (!g) { detailBox.innerHTML = ""; panel.classList.remove("open"); return; }
    panel.classList.add("open");

    const isAdminAcc = session && String(session.vaiTro).trim() === "Admin";

    let html = '<div class="dangky-detail-box"><h3 style="margin-top:0;color:var(--color-primary);">' +
      escapeHtml(g.tendean) + ' <span style="color:var(--color-text-muted);font-weight:normal;">(' + escapeHtml(g.khoaphong) + ')</span></h3>';

    html += '<div class="form-group"><label>File đề án/sáng kiến</label>' + renderPheDuyetFileBoxHtml_(g.fileUrl) + '</div>';

    html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;">';
    if (isAdminAcc) {
      g.phieus.forEach(function (p, pi) {
        const active = pheduyetHistorySelectedPhieuIndex === pi ? " active" : "";
        html += '<button type="button" class="dangky-history-btn' + active + '" onclick="selectPheDuyetHistoryPhieu(' + pi + ')">Phiếu phê duyệt của ' + escapeHtml(p.hoTen || "---") + '</button>';
      });
      if (g.phieus.length === 0) html += '<span style="color:var(--color-text-muted);">Chưa có phiếu phê duyệt nào cho đề án này.</span>';
    } else {
      const ownIndex = g.phieus.findIndex(function (p) { return p.isOwn; });
      const otherIndex = g.phieus.findIndex(function (p) { return !p.isOwn; });
      if (ownIndex !== -1) {
        const active = pheduyetHistorySelectedPhieuIndex === ownIndex ? " active" : "";
        html += '<button type="button" class="dangky-history-btn' + active + '" onclick="selectPheDuyetHistoryPhieu(' + ownIndex + ')">Phiếu phê duyệt của thầy/cô</button>';
      }
      if (otherIndex !== -1) {
        const active = pheduyetHistorySelectedPhieuIndex === otherIndex ? " active" : "";
        html += '<button type="button" class="dangky-history-btn' + active + '" onclick="selectPheDuyetHistoryPhieu(' + otherIndex + ')">Phiếu phê duyệt của Người chấm còn lại</button>';
      } else {
        html += '<button type="button" class="dangky-history-btn" disabled style="opacity:0.5;cursor:not-allowed;" title="Người chấm còn lại chưa nộp phiếu">Phiếu phê duyệt của Người chấm còn lại (chưa nộp)</button>';
      }
    }
    html += '</div>';

    html += '<div id="pheduyetHistoryPhieuBox"></div>';
    html += '</div>';
    detailBox.innerHTML = html;

    if (pheduyetHistorySelectedPhieuIndex !== null) renderPheDuyetHistoryPhieuBox();
  }

  function selectPheDuyetHistoryPhieu(phieuIndex) {
    pheduyetHistorySelectedPhieuIndex = phieuIndex;
    pheduyetHistoryEditingOwn = false;
    renderPheDuyetPhieuDetail();
  }

  // Hien phieu da chon (chi xem), HOAC ve form Chinh sua ngay tai cho neu la phieu CUA CHINH
  // MINH (TVHĐ) VA g.canEditOwn = true (Admin dang mo lan nay + Trang thai o Phan cong con khop)
  // VA nguoi dung dang o che do Sua (pheduyetHistoryEditingOwn).
  function renderPheDuyetHistoryPhieuBox() {
    const box = document.getElementById("pheduyetHistoryPhieuBox");
    if (!box) return;
    const g = pheduyetHistoryData[pheduyetHistoryExpandedIndex];
    const p = g && g.phieus[pheduyetHistorySelectedPhieuIndex];
    if (!p) { box.innerHTML = ""; return; }

    if (p.isOwn && g.canEditOwn && pheduyetHistoryEditingOwn) {
      let html = renderPheDuyetScoreTableHtml("pdHistEdit", g.tieuChi, p.diem, false);
      html += '<div class="form-group"><label>Ý kiến nhận xét</label><textarea id="pdHistEditYKien">' + escapeHtml(p.ykien) + '</textarea></div>';
      html += '<div class="form-group"><label>Kết luận</label>';
      g.ketLuanOptions.forEach(function (opt) {
        const checked = p.ketluan === opt ? "checked" : "";
        html += '<label class="dangky-radio-option"><input type="radio" name="pdHistEditKetLuan" value="' + escapeAttr(opt) + '" ' + checked + '><span class="opt-label">' + escapeHtml(opt) + '</span></label>';
      });
      html += '</div>';
      html += '<div style="display:flex;gap:10px;">' +
        '<button type="button" class="secondary-btn" style="width:auto;padding:10px 20px;" onclick="cancelPheDuyetHistoryEdit()">Hủy</button>' +
        '<button type="button" class="primary" style="width:auto;padding:10px 20px;" id="pdHistEditSaveBtn" onclick="savePheDuyetHistoryEdit()">Lưu</button>' +
        '</div>';
      html += '<div id="pheduyetHistoryEditMessage" class="msg"></div>';
      box.innerHTML = html;
      recomputePheDuyetTotal("pdHistEdit");
      return;
    }

    let html = renderPheDuyetScoreTableHtml("pdHist" + pheduyetHistoryExpandedIndex + "_" + pheduyetHistorySelectedPhieuIndex, g.tieuChi, p.diem, true, p.tongdiem);
    html += '<div class="form-group"><label>Ý kiến nhận xét</label><div>' + (p.ykien ? nl2br(p.ykien) : '<span style="color:#999;">(không có)</span>') + '</div></div>';
    html += '<div class="form-group"><label>Kết luận</label><div><b>' + escapeHtml(p.ketluan) + '</b></div></div>';
    html += '<div class="file-note">Thời gian nộp: ' + escapeHtml(p.thoigian) + '</div>';
    if (p.isOwn && g.canEditOwn) {
      html += '<button type="button" class="secondary-btn" style="width:auto;padding:10px 20px;margin-top:10px;" onclick="enterPheDuyetHistoryEdit()">Chỉnh sửa</button>';
    }
    box.innerHTML = html;
  }

  function enterPheDuyetHistoryEdit() { pheduyetHistoryEditingOwn = true; renderPheDuyetHistoryPhieuBox(); }
  function cancelPheDuyetHistoryEdit() { pheduyetHistoryEditingOwn = false; renderPheDuyetHistoryPhieuBox(); }

  function savePheDuyetHistoryEdit() {
    const g = pheduyetHistoryData[pheduyetHistoryExpandedIndex];
    const diem = [];
    for (let i = 0; i < 10; i++) {
      const el = document.getElementById("pdHistEdit_diem_" + i);
      diem.push(el ? el.value : "");
    }
    const ykien = document.getElementById("pdHistEditYKien").value.trim();
    const ketLuanEl = document.querySelector('input[name="pdHistEditKetLuan"]:checked');
    const ketLuan = ketLuanEl ? ketLuanEl.value : "";

    const msgBox = document.getElementById("pheduyetHistoryEditMessage");
    msgBox.innerHTML = "";
    if (!ketLuan) { msgBox.innerHTML = '<span class="error">Vui lòng chọn Kết luận.</span>'; return; }

    const btn = document.getElementById("pdHistEditSaveBtn");
    btn.disabled = true; btn.innerText = "Đang lưu...";

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false; btn.innerText = "Lưu";
        if (!result.success) { msgBox.innerHTML = '<span class="error">' + escapeHtml(result.message) + '</span>'; return; }
        pheduyetHistoryEditingOwn = false;
        loadPheDuyetHistoryForRound();
      })
      .withFailureHandler(function (error) {
        btn.disabled = false; btn.innerText = "Lưu";
        if (isSessionExpiredError(error)) { showSessionExpiredModal(); return; }
        msgBox.innerHTML = '<span class="error">Có lỗi xảy ra: ' + escapeHtml(error.message) + '</span>';
      })
      .savePheDuyetPhieu(token(), pheduyetLan, {
        maDeAn: g.madean, khoaPhong: g.khoaphong, tenDeAn: g.tendean, dangkyId: g.dangkyId,
        diem: diem, ykienNhanXet: ykien, ketLuan: ketLuan
      });
  }

  // ==========================================================
  // ESCAPE HTML
  // ==========================================================
  function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }
  function escapeAttr(value) { return escapeHtml(value); }




  function nl2br(value) {
    return escapeHtml(value).replace(/\r\n|\r|\n/g, "<br>");
  }
</script>
