<style>
  /* ===== BANG MAU CHUNG (phoi tu 2 anh tham khao, tong xanh duong nghiem tuc) ===== */
  :root {
    --color-primary: #0B4F8C;
    --color-primary-dark: #023E73;
    --color-accent: #2A95BF;
    --color-accent-light: #73C6D9;
    --color-bg-page: #EDF3F9;
    --color-bg-tint: #EAF3FA;
    --color-bg-tint2: #DCEEF5;
    --color-text: #22303F;
    --color-text-muted: #64748B;
    --color-border: #D9E4F0;
    --color-success: #198754;
    --color-danger: #dc3545;
    --header-h: 66px; /* fallback, duoc JS cap nhat chinh xac theo tung man hinh (updateHeaderOffset) */


    /* ===== BIEN MOI CHO APP SHELL (Giai doan 1 - Redesign) - dat ten theo dung yeu cau,
       alias lai tu bang mau da co san o tren, KHONG doi mau. ===== */
    --primary: var(--color-primary);
    --primary-light: var(--color-bg-tint);
    --bg: var(--color-bg-page);
    --surface: #ffffff;
    --border: var(--color-border);
    --text: var(--color-text);
    --text-muted: var(--color-text-muted);
    --success: var(--color-success);
    --warning: #C77700;
    --danger: var(--color-danger);
    --radius: 10px;
    --sidebar-width: 240px;
    --topbar-height: 60px;
  }




  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Be Vietnam Pro', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--color-bg-page);
    color: var(--color-text);
    /* Sua loi chu dai bi chay tran ra ngoai man hinh (dac biet tren dien thoai) */
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .screen { display: none; }
  .screen.active { display: block; }
















  /* ===== LOGIN ===== */
  #screen-login {
    min-height: 100vh;
    justify-content: center;
    align-items: center;
  }
















  #screen-login.active {
    display: flex;
  }
  .login-box {
    width: 420px;
    max-width: 92vw;
    background: white;
    padding: 32px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(11,79,140,0.16);
  }
  .login-title { text-align: center; margin-bottom: 26px; }
  .login-title h2 { margin: 0 0 8px; color: var(--color-primary); line-height: 1.4; font-size: 19px; }
  .login-title p { margin: 0; color: var(--color-text-muted); font-size: 14px; }
















  /* Dong luu y phia duoi form dang nhap (he thong dang xay dung, phien 6 tieng...) */
  .login-note {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--color-border);
  }
  .login-note p {
    margin: 0 0 10px;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--color-text-muted);
    text-align: justify;
    overflow-wrap: break-word;
  }
  .login-note p:last-child { margin-bottom: 0; }
  .login-note b { color: var(--color-text); }
















  /* ===== HEADER ===== */
  .header {
    background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
    color: white;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 60;
    box-shadow: 0 2px 10px rgba(2,62,115,0.25);
  }
  .header-title { font-size: 18px; font-weight: bold; overflow-wrap: break-word; max-width: 100%; }
  .user-info { text-align: right; font-size: 13px; line-height: 1.5; display: flex; align-items: center; gap: 12px; max-width: 100%; }
  .user-info > div { overflow-wrap: break-word; word-break: break-word; min-width: 0; }
  .logout-btn {
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.5);
    color: white;
    padding: 7px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    flex-shrink: 0;
  }
  .logout-btn:hover { background: rgba(255,255,255,0.3); }
















  .container { max-width: 1320px; margin: 30px auto; padding: 0 20px 40px; }
  .back-btn {
    margin-bottom: 18px; padding: 9px 16px; border: none; border-radius: 7px;
    background: #64748B; color: white; cursor: pointer;
    position: sticky;
    top: calc(var(--header-h) + 12px);
    z-index: 55;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }
  .back-btn:hover { background: #55626f; }
















  .page-title { margin-bottom: 20px; }
  .page-title h2 { margin: 0 0 6px; color: var(--color-text); }
  .page-title p { margin: 0; color: var(--color-text-muted); }
















  .card, .search-box, .form-box, .result-box, .history-box {
    background: white; padding: 22px; border-radius: 12px;
    box-shadow: 0 5px 20px rgba(11,79,140,0.08); margin-bottom: 22px;
    max-width: 100%;
    overflow-x: hidden;
  }
















  .form-group { margin-bottom: 18px; }
  label { display: block; margin-bottom: 7px; font-weight: bold; font-size: 14px; }
  .required { color: var(--color-danger); }
















  input, select, textarea {
    width: 100%; max-width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 7px;
    font-size: 15px; background: white; font-family: Arial, sans-serif; color: var(--color-text);
  }
  /* Cac trinh duyet KHONG cho tu xuong dong noi dung ben trong <select> gan lien voi he dieu hanh,
     nen chi co the han che chieu rong va cat bot chu qua dai bang dau "..." de khong bi chay tran. */
  select {
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--color-primary); }
  textarea { min-height: 110px; resize: vertical; }
  input[readonly] { background: #f1f3f5; color: #555; }








  /* ===== O NHAP MAT KHAU: nut hien/an (dung chung cho Dang nhap + popup Doi mat khau) ===== */
  .password-field-wrap { position: relative; }
  .password-field-wrap input { padding-right: 44px; }
  .password-toggle-btn {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; font-size: 17px; padding: 6px 8px;
    color: var(--color-text-muted); line-height: 1;
  }
  .password-toggle-btn:hover { color: var(--color-text); }
















  button.primary {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: var(--color-primary); color: white; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  button.primary:hover { background: var(--color-primary-dark); }
  button.primary:disabled { background: #9fb9d4; cursor: not-allowed; }
















  #loginMessage, .msg { margin-top: 13px; text-align: center; font-size: 14px; overflow-wrap: break-word; }
  .error { color: var(--color-danger); }
  .success { color: var(--color-success); }
















  /* ===== MENU ===== */
  .welcome { text-align: center; margin: 40px 20px 30px; }
  .welcome p { color: var(--color-text-muted); }
  .menu { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; padding: 20px; }
  .menu-card {
    background: white; border-radius: 14px; padding: 30px 22px; text-align: center; cursor: pointer;
    box-shadow: 0 5px 20px rgba(11,79,140,0.08); transition: 0.15s;
  }
  .menu-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(11,79,140,0.16); }
  .menu-icon { font-size: 40px; margin-bottom: 12px; }
  .menu-card h3 { color: var(--color-primary); margin-bottom: 8px; font-size: 16px; overflow-wrap: break-word; }
  .menu-card p { color: var(--color-text-muted); font-size: 13px; line-height: 1.5; overflow-wrap: break-word; }
















  /* ===== TABLE ===== */
  .info-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .info-table th, .info-table td { border: 1px solid var(--color-border); padding: 9px 10px; text-align: left; vertical-align: top; overflow-wrap: break-word; word-break: break-word; }
  .info-table td { text-align: justify; }
  .info-table th { text-align: left; } /* ten cot van can le trai, khong bi justify */
  .info-table th { width: 240px; background: var(--color-bg-tint); font-weight: bold; font-size: 14px; }
  .status { font-weight: bold; color: var(--color-primary); }
  .empty { text-align: center; color: var(--color-text-muted); padding: 26px; }
















  .table-wrapper { overflow-x: auto; }
  table.history { width: 100%; border-collapse: collapse; min-width: 950px; }
  table.history th, table.history td { border: 1px solid var(--color-border); padding: 9px; text-align: left; vertical-align: top; font-size: 13px; overflow-wrap: break-word; word-break: break-word; }
  table.history td { text-align: justify; }
  table.history th { text-align: left; }
  table.history th { background: var(--color-bg-tint); white-space: nowrap; }
  .file-link { color: var(--color-primary); text-decoration: none; cursor: pointer; }
  .file-link:hover { text-decoration: underline; }
  .tag-edited { display: inline-block; margin-top: 4px; font-size: 11px; color: #b5650a; background: #fff3e0; padding: 2px 6px; border-radius: 4px; }
















  .icon-btn { background: none; border: none; cursor: pointer; font-size: 15px; padding: 3px 6px; }
  .icon-btn:hover { opacity: 0.7; }
















  .file-note { margin-top: 6px; font-size: 12px; color: var(--color-text-muted); }
  .file-hint { margin-bottom: 8px; font-size: 12px; color: var(--color-text-muted); line-height: 1.5; font-style: italic; }
















  /* ===== BANG CHI SO DO LUONG (man hinh Cap nhat tien do) ===== */
  .chiso-box { background: var(--color-bg-tint); border: 1px solid var(--color-border); border-radius: 10px; padding: 14px; }
  table.chiso-table { width: 100%; border-collapse: collapse; min-width: 480px; }
  table.chiso-table th, table.chiso-table td { border: 1px solid var(--color-border); padding: 8px; font-size: 13px; text-align: left; vertical-align: top; }
  table.chiso-table th { background: var(--color-bg-tint2); }
  table.chiso-table td:first-child { width: 55%; }
  table.chiso-table input { padding: 7px; font-size: 13px; }
















  /* ===== POP UP CHI SO (Xem chi tiet / Chinh sua) =====
     Cau truc tach rieng: header (tieu de + nut X) va footer KHONG cuon, chi phan body (bang)
     o giua moi cuon - truoc day ca hop popup cuon chung 1 khoi nen tieu de/X bi troi theo. */
  .chiso-modal-box {
    width: 640px;
    padding: 0;
    display: flex;
    flex-direction: column;
    max-height: 85vh;
    overflow: hidden;
  }
  .chiso-modal-header {
    position: relative;
    flex-shrink: 0;
    padding: 20px 54px 14px 24px;
    border-bottom: 1px solid var(--color-border);
  }
  .chiso-modal-header h3 { margin: 0; color: var(--color-primary); }
  .modal-close-x {
    position: absolute; top: 14px; right: 14px;
    width: 30px; height: 30px; border-radius: 8px; border: none;
    background: #fdecea; color: var(--color-danger); font-size: 15px; font-weight: bold;
    cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .modal-close-x:hover { background: #f6c9c5; }
  .chiso-modal-body-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 24px;
  }
  .chiso-modal-footer {
    flex-shrink: 0;
    margin-top: 0 !important;
    padding: 14px 24px 20px;
    border-top: 1px solid var(--color-border);
  }
  table.chiso-popup-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.chiso-popup-table th, table.chiso-popup-table td { border: 1px solid var(--color-border); padding: 10px 12px; font-size: 13.5px; text-align: left; overflow-wrap: break-word; }
      table.chiso-popup-table th:first-child, table.chiso-popup-table td:first-child { width: 55%; }
  table.chiso-popup-table th:last-child, table.chiso-popup-table td:last-child { width: 45%; }
  table.chiso-popup-table thead th {
    background: linear-gradient(var(--color-bg-tint), var(--color-bg-tint2)); color: var(--color-primary);
    position: sticky; top: 0; z-index: 2;
  }
  table.chiso-popup-table tr:nth-child(even) td { background: #fafbfc; }
  table.chiso-popup-table td input { padding: 7px; font-size: 13px; }
















  /* ===== BAO CAO ===== */
  .report-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .report-tab-btn {
    padding: 10px 16px; border: 1px solid var(--color-primary); border-radius: 8px;
    background: white; color: var(--color-primary); cursor: pointer; font-size: 13.5px; font-weight: bold;
  }
  .report-tab-btn:hover { background: var(--color-bg-tint); }
  .report-tab-btn.active { background: var(--color-primary); color: white; }








  .report-summary { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 22px; }
  .report-stat-card {
    flex: 1 1 200px; background: var(--color-bg-tint); border: 1px solid var(--color-border); border-radius: 10px;
    padding: 16px; text-align: center;
  }
  .report-stat-card .num { font-size: 26px; font-weight: bold; color: var(--color-primary); }
  .report-stat-card .lbl { font-size: 12.5px; color: var(--color-text-muted); margin-top: 6px; line-height: 1.4; }








  /* Bieu do tron ve bang CSS thuan (conic-gradient) - khong phu thuoc thu vien ngoai,
     tranh truong hop script CDN bi chan lam trong khoang o giua man hinh nhu truoc day. */
  .report-chart-wrap { max-width: 420px; margin: 0 auto 24px; text-align: center; }
  .pie-chart {
    width: 220px; height: 220px; border-radius: 50%; margin: 0 auto 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.14);
  }
  .pie-legend { display: flex; flex-direction: column; gap: 7px; text-align: left; }
  .pie-legend-item { font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .pie-dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex-shrink: 0; }








  table.report-table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  table.report-table th, table.report-table td { border: 1px solid var(--color-border); padding: 8px 10px; font-size: 13.5px; text-align: left; }
  table.report-table th { background: var(--color-bg-tint); }
  .export-btn { margin-top: 14px; }
















  /* ===== DANG KY: cong tac bat/tat (Admin) - dung chung cho NopLan2, PheDuyet ===== */
  .dangky-toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--color-border);
  }
  .dangky-toggle-row:last-child { border-bottom: none; }
  .dangky-toggle-row .lbl { font-size: 14px; font-weight: bold; }
  .toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; cursor: pointer; inset: 0; background: #ccc; border-radius: 24px; transition: 0.2s;
  }
  .toggle-slider:before {
    content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px;
    background: white; border-radius: 50%; transition: 0.2s;
  }
  .toggle-switch input:checked + .toggle-slider { background: var(--color-primary); }
  .toggle-switch input:checked + .toggle-slider:before { transform: translateX(20px); }








  /* ===== DANG KY: radio chon loai (muc 4) ===== */
  .dangky-radio-option {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    border: 1px solid var(--color-border); border-radius: 8px; margin-bottom: 8px; cursor: pointer;
  }
  .dangky-radio-option:hover { border-color: var(--color-primary); }
  .dangky-radio-option input[type="radio"] { width: auto; flex-shrink: 0; }
  .dangky-radio-option .opt-label { font-size: 14px; flex: 1; }
  .dangky-radio-option.disabled { opacity: 0.55; cursor: not-allowed; background: var(--color-bg-tint); }
  .dangky-radio-option.disabled:hover { border-color: var(--color-border); }
  .dangky-radio-note { font-size: 12px; color: var(--color-danger); white-space: nowrap; flex-shrink: 0; }








  .dangky-section-title { color: var(--color-primary); margin: 22px 0 14px; font-size: 16px; }








  /* O vuong chon 1 (dung radio that de dam bao chi chon duoc 1, chi style lai cho vuong giong dau ☐ trong file goc) */
  .dangky-square-radio {
    appearance: none; -webkit-appearance: none; width: 17px; height: 17px;
    border: 1.5px solid #999; border-radius: 4px; cursor: pointer; margin: 0;
    position: relative; flex-shrink: 0; background: white;
  }
  .dangky-square-radio:checked { background: var(--color-primary); border-color: var(--color-primary); }
  .dangky-square-radio:checked::after {
    content: "✓"; position: absolute; inset: 0; color: white; font-size: 12px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
  }








  /* ===== DANG KY: link bieu mau ===== */
  .dangky-link-list { display: flex; flex-direction: column; gap: 8px; }
  .dangky-link-list a { color: var(--color-primary); font-size: 14px; text-decoration: none; }
  .dangky-link-list a:hover { text-decoration: underline; }








  /* ===== DANG KY: lich su (dung chung cho lich su Dang ky va danh sach Phieu phe duyet) ===== */
  .dangky-history-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .dangky-history-btn {
    padding: 8px 14px; border: 1px solid var(--color-primary); color: var(--color-primary); background: white;
    border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .dangky-history-btn:hover { transform: translateY(-1px); }
  .dangky-history-btn.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }
  .dangky-detail-box { background: var(--color-bg-tint); border: 1px solid var(--color-border); border-radius: 10px; padding: 16px; }








  /* ===== ACCORDION (dung chung cho Lich su dang ky + Danh sach phieu phe duyet) =====
     Ky thuat "0fr -> 1fr" tren grid-template-rows: cho phep chieu cao mo/dong tu dong khop
     dung noi dung ben trong ma van animate muot, khong can JS do chieu cao thu cong bang tay.
     Khi mo (.open), .accordion-panel-inner (overflow:hidden) se lo dan ra theo transition. */
  .accordion-panel {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.28s ease;
  }
  .accordion-panel.open { grid-template-rows: 1fr; }
  .accordion-panel-inner { overflow: hidden; min-height: 0; }




  /* ===== BAO CAO 2 - 2 khoi accordion doc lap (Bao cao cong tac phe duyet) =====
     Tai su dung dung ky thuat .accordion-panel o tren cho phan noi dung mo/dong; rieng phan
     "tieu de khoi" o day la 1 nut bam toan chieu rong, luon hien, kem mui ten xoay huong theo
     trang thai dong/mo (::after, transform rotate) de bao hieu ro rang cho nguoi dung. */
  .report2-block {
    border: 1px solid var(--color-border);
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .report2-block-header {
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    background: var(--color-bg-tint2);
    border: none;
    font-weight: 700;
    font-size: 15px;
    color: var(--color-primary);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.2s ease;
  }
  .report2-block-header::after {
    content: "▾";
    font-size: 13px;
    transition: transform 0.28s ease;
  }
  .report2-block-header.active::after { transform: rotate(180deg); }
  .report2-block-header:hover { background: var(--color-border); }
  .report2-block .accordion-panel-inner { padding: 0 18px; }
  .report2-block .accordion-panel.open .accordion-panel-inner { padding: 18px; }




  /* ===== BIEU DO COT THANH NGANG (diem trung binh tung tieu chi phe duyet) =====
     Dung thanh ngang thay vi cot doc vi noi dung tieu chi la ca 1 cau dai, khong the rut gon
     thanh nhan truc X ngan duoc. Moi tieu chi = 1 dong: nhan phia tren, thanh diem phia duoi. */
  .tieuchi-bar-chart { margin-bottom: 26px; }
  .tieuchi-bar-row { margin-bottom: 12px; }
  .tieuchi-bar-label { font-size: 13px; color: var(--color-text); margin-bottom: 4px; line-height: 1.4; }
  .tieuchi-bar-track { position: relative; background: var(--color-bg-tint); border-radius: 6px; height: 24px; overflow: hidden; }
  .tieuchi-bar-fill { height: 100%; background: var(--color-primary); border-radius: 6px; transition: width 0.4s ease; }
  .tieuchi-bar-value { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 700; color: var(--color-primary-dark); }








  /* Noi dung ben trong accordion (dung chung .dangky-detail-box) tu fade+truot nhe moi lan
     duoc render moi (moi lan innerHTML thay doi la 1 phan tu DOM moi -> animation tu retrigger) */
  @keyframes accFadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .dangky-detail-box { animation: accFadeIn 0.22s ease; }
















  @media (max-width: 900px) {
    .menu { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 700px) {
    .header { flex-direction: column; text-align: center; }
    .user-info { justify-content: center; }
    .menu { grid-template-columns: 1fr; }
    .info-table { table-layout: auto; }
    .info-table th { width: 40%; }
  }
/* ===== MODAL DUNG CHUNG (SUA / XOA) ===== */
 .modal-overlay {
   display: none;
   position: fixed; inset: 0;
   background: rgba(2,62,115,0.45);
   align-items: center; justify-content: center;
   z-index: 1000;
   padding: 20px;
 }
 .modal-overlay.show { display: flex; }
